name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.projects.outputs.node }}
      python: ${{ steps.projects.outputs.python }}
      go: ${{ steps.projects.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect supported project manifests
        id: projects
        shell: bash
        run: |
          set -euo pipefail
          node=false
          python=false
          go=false

          [[ -f package.json ]] && node=true
          [[ -f pyproject.toml || -f requirements.txt || -f setup.py || -f setup.cfg || -f Pipfile ]] && python=true
          [[ -f go.mod ]] && go=true

          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

          if [[ "$node" != "true" && "$python" != "true" && "$go" != "true" ]]; then
            echo "::error title=No supported project manifest::Add package.json, a Python project file, or go.mod before running CI."
            exit 1
          fi

  node:
    name: Node.js tests
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - run: npm test

  python:
    name: Python tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e .
          fi
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: python -m pytest

  go:
    name: Go tests
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...